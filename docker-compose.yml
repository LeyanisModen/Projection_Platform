version: '3.8'

services:
  db:
    image: postgres:15
    container_name: proyeccion-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: proyeccion_moden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  backend:
    build: ./api_proyeccion_moden
    container_name: proyeccion-backend
    restart: always
    volumes:
      - ./api_proyeccion_moden:/app
    ports:
      - "8000:8000"
    # Railway migra en preDeployCommand; en local lo hacemos aqui para que
    # el Dockerfile tenga un unico comando de arranque.
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && exec gunicorn proyeccion_moden.wsgi --bind [::]:8000
      --workers=2 --threads=4 --timeout=120 --keep-alive=5 --log-file=-"
    environment:
      - POSTGRES_DB=proyeccion_moden
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  frontend:
    build: ./app_proyeccion_moden
    container_name: proyeccion-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - PORT=80
      - BACKEND_ORIGIN=http://backend:8000
      - BACKEND_HOST=backend
      - NGINX_RESOLVER=127.0.0.11
    depends_on:
      - backend

volumes:
  postgres_data:
